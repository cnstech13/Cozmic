<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | cozmic</title>

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>

    <style>
        :root {
            --navy: #0b1f3a;
            --blue: #1769ff;
            --aqua: #35e0d0;
            --white: #ffffff;
            --light: #f4f7fb;
            --border: #dce3ed;
            --text: #25344a;
            --muted: #728096;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--light);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .messenger {
            display: flex;
            height: 100dvh;
            max-width: 1400px;
            margin: auto;
            background: var(--white);
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--white);
        }

        .sidebar-header {
            padding: 20px;
            background: var(--navy);
            color: var(--white);
        }

        .sidebar-header h2 {
            margin: 0 0 14px;
            font-size: 23px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            outline: none;
        }

        .sidebar-heading {
            padding: 14px 16px 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            display: flex;
            gap: 11px;
            align-items: center;
            width: 100%;
            padding: 14px;
            border: 0;
            border-bottom: 1px solid #edf0f5;
            background: var(--white);
            text-align: left;
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: #edf4ff;
        }

        .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--navy);
            color: var(--white);
            font-weight: bold;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .conversation-info {
            min-width: 0;
            flex: 1;
        }

        .conversation-name {
            display: block;
            margin-bottom: 5px;
            color: var(--navy);
            font-weight: bold;
        }

        .conversation-preview {
            display: block;
            color: var(--muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-panel {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            background: var(--white);
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header h3 {
            margin: 0 0 5px;
            color: var(--navy);
        }

        .chat-status {
            color: var(--muted);
            font-size: 12px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 5px;
            border-radius: 50%;
            background: #a0a8b4;
        }

        .online-dot.online {
            background: #20b56b;
        }

        .back-button {
            display: none;
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: #edf2fa;
        }

       /* =========================================
   cozmic — MODERN MESSAGE DISPLAY
========================================= */

.messages-area {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    overflow-y: auto;
    overscroll-behavior: contain;
    background:
        radial-gradient(
            circle at top right,
            rgba(53, 224, 208, 0.07),
            transparent 35%
        ),
        #f4f7fb;
    scroll-behavior: smooth;
}

.empty-state {
    margin: auto;
    max-width: 300px;
    padding: 20px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
}

.message-row {
    display: flex;
    width: 100%;
    align-items: flex-end;
    animation: messageAppear 0.2s ease;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-bubble {
    width: fit-content;
    max-width: min(80%, 520px);
    min-width: 90px;
    padding: 12px 14px 8px;
    border: 1px solid #e0e7f0;
    border-radius: 18px 18px 18px 5px;
    background: #ffffff;
    color: #25344a;
    overflow-wrap: anywhere;
    box-shadow: 0 3px 10px rgba(11, 31, 58, 0.045);
}

.message-row.mine .message-bubble {
    border-color: #1769ff;
    border-radius: 18px 18px 5px 18px;
    background: linear-gradient(135deg, #1769ff, #2458d8);
    color: #ffffff;
}

.message-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
    font-size: 14px;
}

.message-text:empty {
    display: none;
}

.message-time {
    display: block;
    margin-top: 8px;
    color: #8290a5;
    font-size: 10px;
    text-align: right;
}

.message-row.mine .message-time {
    color: #dce8ff;
}

/* ATTACHMENT CARDS */

.message-attachment {
    width: 100%;
    min-width: 0;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #e5eaf2;
    border-radius: 13px;
    background: #f7f9fc;
    color: #25344a;
    overflow-wrap: anywhere;
}

.message-row.mine .message-attachment {
    border-color: rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.97);
    color: #25344a;
}

.attachment-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.attachment-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: #e8efff;
    font-size: 21px;
}

.attachment-details {
    display: block;
    margin-top: 5px;
    color: #728096;
    font-size: 11px;
}

.attachment-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.attachment-action {
    min-height: 36px;
    padding: 8px 12px;
    border: 0;
    border-radius: 9px;
    background: #1769ff;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
}

.attachment-action.secondary {
    border: 1px solid #dce3ed;
    background: #ffffff;
    color: #0b1f3a;
}

.attachment-action:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* IMAGE PREVIEWS */

.message-image-preview {
    display: block;
    width: 100%;
    max-width: 320px;
    max-height: 300px;
    margin-top: 10px;
    border-radius: 12px;
    background: #e9edf4;
    object-fit: cover;
    cursor: zoom-in;
}

.message-image-preview:hover {
    opacity: 0.94;
}

.image-lightbox {
    position: fixed;
    z-index: 99999;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(4, 12, 25, 0.94);
}

.image-lightbox[hidden] {
    display: none;
}

.image-lightbox-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-width: 100%;
    max-height: 100%;
}

.image-lightbox img {
    display: block;
    max-width: 100%;
    max-height: 75vh;
    border-radius: 12px;
    object-fit: contain;
}

.image-lightbox-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.image-lightbox button,
.image-lightbox a {
    padding: 10px 15px;
    border: 0;
    border-radius: 9px;
    background: #35e0d0;
    color: #0b1f3a;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
}

/* VOICE MESSAGE CARDS */

.voice-message-card {
    width: 100%;
    min-width: 220px;
    max-width: 320px;
    margin-top: 10px;
    padding: 13px;
    border: 1px solid #dce5f3;
    border-radius: 14px;
    background: #f5f8ff;
}

.voice-message-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    color: #0b1f3a;
    font-size: 13px;
    font-weight: 700;
}

.voice-message-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #dce8ff;
    font-size: 18px;
}

.voice-message-card audio {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 40px;
}

.voice-load-button {
    width: 100%;
    padding: 10px;
    border: 0;
    border-radius: 9px;
    background: #1769ff;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
}

.voice-duration {
    display: block;
    margin-top: 8px;
    color: #728096;
    font-size: 11px;
}

/* RECORDING PREVIEW */

.voice-preview {
    display: none;
    margin-top: 12px;
    padding: 13px;
    border: 1px solid #dce3ed;
    border-radius: 13px;
    background: #f4f7fb;
}

.voice-preview.visible {
    display: block;
}

.voice-preview audio {
    display: block;
    width: 100%;
    margin-bottom: 10px;
}

.voice-preview button {
    margin: 4px 5px 0 0;
    padding: 9px 12px;
    border: 0;
    border-radius: 9px;
    background: #1769ff;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
}

.voice-preview #cancelVoiceButton {
    background: #ffe8eb;
    color: #dc3545;
}

/* MESSAGE ANIMATION */

@keyframes messageAppear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */

@media (max-width: 650px) {
    .messages-area {
        gap: 12px;
        padding: 12px;
    }

    .message-bubble {
        max-width: 88%;
        padding: 11px 12px 8px;
    }

    .message-text {
        font-size: 14px;
    }

    .message-image-preview {
        max-width: 250px;
        max-height: 240px;
    }

    .voice-message-card {
        min-width: 0;
        max-width: 270px;
    }

    .image-lightbox {
        padding: 12px;
    }

        }
    </style>

<body>

<div class="messenger" id="messenger">

    <!-- CONVERSATION SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h2>cozmic</h2>

            <input
                type="search"
                id="searchUsers"
                class="search-box"
                placeholder="Search people..."
                autocomplete="off"
            >
        </div>

        <div class="sidebar-heading">Conversations and people</div>

        <div
            id="conversationList"
            class="conversation-list"
            aria-live="polite">
            <div class="empty-state">Loading conversations...</div>
        </div>

    </aside>


    <!-- CHAT PANEL -->
    <main class="chat-panel" id="chatPanel">

        <header class="chat-header">

            <button
                type="button"
                id="backButton"
                class="back-button">
                ←
            </button>

            <div class="avatar" id="chatAvatar">C</div>

            <div class="chat-header-info">
                <h3 id="chatName">Messages</h3>

                <div class="chat-status" id="chatStatus">
                    Select a conversation
                </div>

                <span id="chatOnlineDot" class="online-dot"></span>
            </div>

        </header>


        <!-- MESSAGES -->
        <section
            id="messagesArea"
            class="messages-area"
            aria-live="polite">

            <div class="empty-state">
                Select a person to start messaging.
            </div>

        </section>


        <!-- MESSAGE COMPOSER -->
        <footer class="composer">

            <div
                id="attachmentPreview"
                class="attachment-preview"
                hidden>
            </div>

            <form id="messageForm">

                <div class="composer-row">

                    <label
                        for="messageFile"
                        class="attach-button"
                        title="Attach a file"
                        aria-label="Attach a file">
                        📎
                    </label>

                    <input
                        type="file"
                        id="messageFile"
                        hidden
                        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.jpg,.jpeg,.png,.webp,.gif,.mp4,.mp3,.m4a,.wav,.zip"
                    >

                    <textarea
                        id="messageInput"
                        placeholder="Type a message..."
                        rows="1"
                        maxlength="10000">
                    </textarea>

                    <button
                        type="button"
                        id="recordButton"
                        class="icon-button"
                        title="Record voice message">
                        🎙️
                    </button>

                    <button
                        type="submit"
                        id="sendButton"
                        class="send-button">
                        Send
                    </button>

                </div>

            </form>


            <!-- VOICE RECORDING STATUS -->
            <div
                id="recordingStatus"
                class="recording-status"
                hidden>
            </div>


            <!-- VOICE PREVIEW -->
            <div id="voicePreview" class="voice-preview">

                <audio
                    id="voicePreviewPlayer"
                    controls>
                </audio>

                <button
                    type="button"
                    id="sendVoiceButton">
                    Send voice message
                </button>

                <button
                    type="button"
                    id="cancelVoiceButton">
                    Cancel
                </button>

            </div>

        </footer>

    </main>

</div>


<script>
"use strict";

/* =====================================================
   cozmic
   PRIVATE MESSAGING, FILE SHARING AND VOICE MESSAGES
===================================================== */

const client = window.supabaseClient;

if (!client) {
    console.error(
        "Supabase client was not initialized. Check supabase-config.js."
    );

    if (window.Swal) {
        Swal.fire({
            icon: "error",
            title: "Configuration error",
            text: "Supabase client was not initialized. Check supabase-config.js."
        });
    }

    throw new Error("Supabase client is missing.");
}


/* =====================================================
   DOM ELEMENTS
===================================================== */

const messenger = document.getElementById("messenger");
const conversationList = document.getElementById("conversationList");
const searchUsers = document.getElementById("searchUsers");

const messagesArea = document.getElementById("messagesArea");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

const chatName = document.getElementById("chatName");
const chatAvatar = document.getElementById("chatAvatar");
const chatStatus = document.getElementById("chatStatus");
const chatOnlineDot = document.getElementById("chatOnlineDot");

const backButton = document.getElementById("backButton");

const messageFile = document.getElementById("messageFile");
const attachmentPreview = document.getElementById("attachmentPreview");

const recordButton = document.getElementById("recordButton");
const sendVoiceButton = document.getElementById("sendVoiceButton");
const cancelVoiceButton = document.getElementById("cancelVoiceButton");

const recordingStatus = document.getElementById("recordingStatus");
const voicePreview = document.getElementById("voicePreview");
const voicePreviewPlayer = document.getElementById("voicePreviewPlayer");


/* =====================================================
   REQUIRED ELEMENT CHECK
===================================================== */

const requiredElements = {
    messenger,
    conversationList,
    searchUsers,
    messagesArea,
    messageForm,
    messageInput,
    sendButton,
    chatName,
    chatAvatar,
    chatStatus,
    chatOnlineDot,
    backButton,
    messageFile,
    attachmentPreview,
    recordButton,
    sendVoiceButton,
    cancelVoiceButton,
    recordingStatus,
    voicePreview,
    voicePreviewPlayer
};

const missingElements = Object.entries(requiredElements)
    .filter(([, element]) => !element)
    .map(([name]) => name);

if (missingElements.length > 0) {
    console.error(
        "Missing messaging HTML elements:",
        missingElements
    );

    throw new Error(
        "Missing HTML elements: " + missingElements.join(", ")
    );
}


/* =====================================================
   CONFIGURATION
===================================================== */

const MAX_FILE_SIZE = 20 * 1024 * 1024;

const FILE_BUCKET = "shared-files";
const VOICE_BUCKET = "voice-messages";

const ALLOWED_EXTENSIONS = new Set([
    "pdf",
    "doc",
    "docx",
    "xls",
    "xlsx",
    "ppt",
    "pptx",
    "txt",
    "csv",
    "jpg",
    "jpeg",
    "png",
    "webp",
    "gif",
    "mp4",
    "mp3",
    "m4a",
    "wav",
    "zip",
    "webm",
    "ogg"
]);

const IMAGE_EXTENSIONS = new Set([
    "jpg",
    "jpeg",
    "png",
    "webp",
    "gif"
]);

const AUDIO_EXTENSIONS = new Set([
    "mp3",
    "m4a",
    "wav",
    "ogg",
    "webm"
]);

const VIDEO_EXTENSIONS = new Set([
    "mp4"
]);

const DOCUMENT_EXTENSIONS = new Set([
    "pdf",
    "doc",
    "docx",
    "xls",
    "xlsx",
    "ppt",
    "pptx",
    "txt",
    "csv",
    "zip"
]);


/* =====================================================
   APPLICATION STATE
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;

let profilesCache = new Map();
let conversationCache = new Map();

let messageCache = new Map();
let attachmentCache = new Map();
let voiceCache = new Map();

let attachmentBusy = false;
let voiceBusy = false;

let recorder = null;
let recorderStream = null;
let recordedChunks = [];
let recordedVoiceBlob = null;

let recordingStartedAt = 0;
let recordedDurationSeconds = 0;

let activeChannel = null;

let refreshTimer = null;
let relativeTimeTimer = null;
let searchTimeout = null;
let recordingTimer = null;

let currentLoadToken = 0;

let voicePreviewObjectUrl = null;

const objectUrls = new Set();


/* =====================================================
   GENERAL HELPERS
===================================================== */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}


function showError(message) {
    if (!window.Swal) {
        alert(message);
        return;
    }

    Swal.fire({
        icon: "error",
        title: "Unable to complete action",
        text: message
    });
}


function showSuccess(message) {
    if (!window.Swal) {
        console.log(message);
        return;
    }

    Swal.fire({
        icon: "success",
        title: "Successful",
        text: message,
        timer: 1800,
        showConfirmButton: false
    });
}


function displayName(profile) {
    return profile?.full_name ||
        profile?.username ||
        "User";
}


function initials(profile) {
    const name = displayName(profile).trim();

    return name ? name.charAt(0).toUpperCase() : "U";
}


function makeObjectURL(blob) {
    const url = URL.createObjectURL(blob);

    objectUrls.add(url);

    return url;
}


function revokeObjectURL(url) {
    if (!url) return;

    URL.revokeObjectURL(url);

    objectUrls.delete(url);
}


function formatFileSize(bytes) {
    const size = Number(bytes || 0);

    if (size < 1024) {
        return size + " B";
    }

    if (size < 1024 * 1024) {
        return (size / 1024).toFixed(1) + " KB";
    }

    return (size / (1024 * 1024)).toFixed(2) + " MB";
}


function getExtension(filename) {
    const parts = String(filename || "").split(".");

    return parts.length > 1
        ? parts.pop().toLowerCase()
        : "";
}


function makeSafeFilename(filename) {
    const extension = getExtension(filename);

    const base = String(filename || "file")
        .replace(/\.[^.]+$/, "")
        .replace(/[^a-zA-Z0-9_-]/g, "_")
        .slice(0, 80) || "file";

    return base + (extension ? "." + extension : "");
}


function fileIcon(filename) {
    const extension = getExtension(filename);

    if (IMAGE_EXTENSIONS.has(extension)) return "🖼️";
    if (extension === "pdf") return "📕";
    if (["doc", "docx"].includes(extension)) return "📘";
    if (["xls", "xlsx", "csv"].includes(extension)) return "📊";
    if (VIDEO_EXTENSIONS.has(extension)) return "🎬";
    if (AUDIO_EXTENSIONS.has(extension)) return "🎵";
    if (extension === "zip") return "🗜️";

    return "📄";
}


function setAttachmentBusy(value) {
    attachmentBusy = value;

    sendButton.disabled = value || voiceBusy;
    messageFile.disabled = value || voiceBusy;
    recordButton.disabled = value || voiceBusy;
}


/* =====================================================
   RELATIVE MESSAGE TIMES
===================================================== */

function formatTime(dateValue) {
    if (!dateValue) return "";

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    const difference = Math.max(0, Date.now() - date.getTime());

    const seconds = Math.floor(difference / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);

    if (seconds < 10) return "Just now";

    if (seconds < 60) {
        return seconds + " seconds ago";
    }

    if (minutes < 60) {
        return minutes === 1
            ? "1 minute ago"
            : minutes + " minutes ago";
    }

    if (hours < 24) {
        return hours === 1
            ? "1 hour ago"
            : hours + " hours ago";
    }

    if (days < 7) {
        return days === 1
            ? "1 day ago"
            : days + " days ago";
    }

    const weeks = Math.floor(days / 7);

    if (days < 30) {
        return weeks === 1
            ? "1 week ago"
            : weeks + " weeks ago";
    }

    const months = Math.floor(days / 30);

    if (days < 365) {
        return months === 1
            ? "1 month ago"
            : months + " months ago";
    }

    const years = Math.floor(days / 365);

    return years === 1
        ? "1 year ago"
        : years + " years ago";
}


function refreshRelativeMessageTimes() {
    document
        .querySelectorAll(".message-time[data-timestamp]")
        .forEach(element => {
            const timestamp = element.dataset.timestamp;
            const isMine = element.dataset.isMine === "true";
            const isRead = element.dataset.isRead === "true";

            let label = formatTime(timestamp);

            if (isMine && isRead) {
                label += " · Read";
            }

            element.textContent = label;
        });
}

async function getProfile(userId) {
    if (!userId) return null;

    if (profilesCache.has(userId)) {
        return profilesCache.get(userId);
    }

    const { data, error } = await client
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();

/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations() {
    conversationList.innerHTML = `
        <div class="empty-state">Loading conversations...</div>
    `;

    const { data, error } = await client
        .from("conversations")
        .select("*")
        .or(
            `user_one.eq.${currentUser.id},user_two.eq.${currentUser.id}`
        )
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Conversation loading error:", error);

        conversationList.innerHTML = `
            <div class="empty-state">
                Could not load conversations.
            </div>
        `;

        return;
    }

    conversationCache.clear();

        const otherId =
            conversation.user_one === currentUser.id
                ? conversation.user_two
                : conversation.user_one;

        const profile = await getProfile(otherId);

        if (!profile) continue;

        conversationCache.set(conversation.id, {
            conversation,
            profile
        });
    }

    await renderConversationList(searchUsers.value);
}

async function renderConversationList(searchTerm = "") {
    conversationList.replaceChildren();

    const term = String(searchTerm || "").trim().toLowerCase();

    const listedProfiles = new Set();

    const items = [...conversationCache.entries()]
        .filter(([, item]) => {
            const name = displayName(item.profile).toLowerCase();

            const username = String(
                item.profile.username || ""
            ).toLowerCase();

            return !term ||
                name.includes(term) ||
                username.includes(term);
        });

    for (const [id, item] of items) {
        conversationList.appendChild(
            createConversationButton(item.profile, id)
        );

        listedProfiles.add(item.profile.id);
    }

    if (!term) {
        if (items.length === 0) {
            conversationList.innerHTML = `
                <div class="empty-state">
                    No conversations yet. Search for someone to start chatting.
                </div>
            `;
        }

        return;
    }

    const results = await searchProfiles(term);

    for (const profile of results) {
        if (listedProfiles.has(profile.id)) continue;

        conversationList.appendChild(
            createConversationButton(profile)
        );

        listedProfiles.add(profile.id);
    }

    if (listedProfiles.size === 0) {
        conversationList.innerHTML = `
            <div class="empty-state">
                No users found.
            </div>
        `;
    }
}


/* =====================================================
   SEARCH PROFILES
===================================================== */

async function searchProfiles(term) {
    const safeTerm = String(term || "")
        .replace(/[%_,()]/g, " ")
        .trim();

    if (!safeTerm) return [];

    const { data, error } = await client
        .from("profiles")
        .select("*")
        .or(
            `username.ilike.%${safeTerm}%,full_name.ilike.%${safeTerm}%`
        )
        .neq("id", currentUser.id)
        .limit(15);

    if (error) {
        console.error("User search error:", error);
        return [];
    }

    return data || [];
}


/* =====================================================
   START OR OPEN CONVERSATION
===================================================== */

async function startConversation(profile) {
    if (!profile || profile.id === currentUser.id) return;

    const existing = [...conversationCache.values()].find(item => {
        return item.profile.id === profile.id;
    });

    if (existing) {
        await openConversation(existing.conversation.id);
        return;
    }

    const { data: existingRows, error: lookupError } = await client
        .from("conversations")
        .select("*")
        .or(
            `and(user_one.eq.${currentUser.id},user_two.eq.${profile.id}),and(user_one.eq.${profile.id},user_two.eq.${currentUser.id})`
        )
        .limit(1);

    if (lookupError) {
        console.error("Conversation lookup error:", lookupError);

        showError("Could not check for an existing conversation.");

        return;
    }

    let conversation = existingRows?.[0];

    if (!conversation) {
        const { data, error } = await client
            .from("conversations")
            .insert({
                user_one: currentUser.id,
                user_two: profile.id
            })
            .select()
            .single();

        if (error) {
            console.error("Conversation creation error:", error);

            showError(
                "Could not create the conversation. Check your Supabase policies."
            );

            return;
        }

        conversation = data;
    }

    conversationCache.set(conversation.id, {
        conversation,
        profile
    });

    await renderConversationList(searchUsers.value);

    await openConversation(conversation.id);
}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(conversationId) {
    const item = conversationCache.get(conversationId);

    if (!item) return;

    currentConversation = item.conversation;
    currentOtherUser = item.profile;

    currentLoadToken++;

    messenger.classList.add("chat-open");

    chatName.textContent = displayName(currentOtherUser);

    chatAvatar.replaceChildren();

    if (currentOtherUser.avatar_url) {
        const image = document.createElement("img");

        image.src = currentOtherUser.avatar_url;
        image.alt = displayName(currentOtherUser);

        chatAvatar.appendChild(image);
    } else {
        chatAvatar.textContent = initials(currentOtherUser);
    }

    chatStatus.textContent = "Conversation";

    chatOnlineDot.classList.remove("online");

    await renderConversationList(searchUsers.value);

    await loadMessages(conversationId);

    if (currentConversation?.id !== conversationId) return;

    await markMessagesRead(conversationId);

    subscribeToConversation(conversationId);
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(conversationId) {
    if (!conversationId) return;

    const loadToken = currentLoadToken;

    messagesArea.innerHTML = `
        <div class="empty-state">Loading messages...</div>
    `;

    const { data, error } = await client
        .from("messages")
        .select("*")
        .eq("conversation_id", conversationId)
        .order("created_at", { ascending: true });

    if (loadToken !== currentLoadToken) return;

    if (error) {
        console.error("Message loading error:", error);

        messagesArea.innerHTML = `
            <div class="empty-state">
                Could not load messages.
            </div>
        `;

        return;
    }

    const messages = data || [];

    const messageIds = messages.map(message => message.id);

    attachmentCache.clear();
    voiceCache.clear();

    if (messageIds.length > 0) {
        await Promise.all([
            loadAttachments(messageIds),
            loadVoiceMetadata(messageIds)
        ]);
    }

    if (loadToken !== currentLoadToken) return;

    messagesArea.replaceChildren();

    messageCache.clear();

    if (messages.length === 0) {
        messagesArea.innerHTML = `
            <div class="empty-state">
                No messages yet. Say hello!
            </div>
        `;

        return;
    }

    for (const message of messages) {
        if (loadToken !== currentLoadToken) return;

        messageCache.set(message.id, message);

        await renderMessage(message);
    }

    refreshRelativeMessageTimes();

    messagesArea.scrollTop = messagesArea.scrollHeight;
}


/* =====================================================
   LOAD ATTACHMENT METADATA
===================================================== */

async function loadAttachments(messageIds) {
    if (!messageIds.length) return;

    const { data, error } = await client
        .from("message_attachments")
        .select("*")
        .in("message_id", messageIds);

    if (error) {
        console.error("Attachment metadata error:", error);
        return;
    }

    for (const attachment of data || []) {
        if (!attachmentCache.has(attachment.message_id)) {
            attachmentCache.set(attachment.message_id, []);
        }

        attachmentCache.get(attachment.message_id).push(attachment);
    }
}


/* =====================================================
   LOAD VOICE METADATA
===================================================== */

async function loadVoiceMetadata(messageIds) {
    if (!messageIds.length) return;

    const { data, error } = await client
        .from("voice_messages")
        .select("*")
        .in("message_id", messageIds);

    if (error) {
        console.error("Voice metadata error:", error);
        return;
    }

    for (const voice of data || []) {
        voiceCache.set(voice.message_id, voice);
    }
}


/* =====================================================
   RENDER MESSAGE
===================================================== */

async function renderMessage(message) {
    const row = document.createElement("div");

    row.className = "message-row";

    const isMine = message.sender_id === currentUser.id;

    if (isMine) {
        row.classList.add("mine");
    }

    const bubble = document.createElement("div");

    bubble.className = "message-bubble";

    if (message.message_text) {
        const text = document.createElement("div");

        text.className = "message-text";
        text.textContent = message.message_text;

        bubble.appendChild(text);
    }

    const voice = voiceCache.get(message.id);

    if (voice) {
        const voiceElement = await createVoicePlayer(voice);

        if (voiceElement) {
            bubble.appendChild(voiceElement);
        }
    }

    const attachments = attachmentCache.get(message.id) || [];

    for (const attachment of attachments) {
        const element = await createAttachmentElement(attachment);

        if (element) {
            bubble.appendChild(element);
        }
    }

    const time = document.createElement("span");

    time.className = "message-time";

    time.dataset.timestamp = message.created_at || "";
    time.dataset.isMine = String(isMine);
    time.dataset.isRead = String(Boolean(message.is_read));

    time.textContent =
        formatTime(message.created_at) +
        (isMine && message.is_read ? " · Read" : "");

    if (message.created_at) {
        time.title = new Date(message.created_at).toLocaleString();
    }

    bubble.appendChild(time);

    row.appendChild(bubble);

    messagesArea.appendChild(row);
}

async function downloadAttachment(attachment, button) {
    button.disabled = true;
    button.textContent = "Downloading...";

    try {
        const { data, error } = await client.storage
            .from(FILE_BUCKET)
            .download(attachment.file_path);

        if (error) throw error;

        const objectUrl = makeObjectURL(data);

        const link = document.createElement("a");

        link.href = objectUrl;
        link.download = makeSafeFilename(attachment.file_name);

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(() => {
            revokeObjectURL(objectUrl);
        }, 30000);

    } catch (error) {
        console.error("Download error:", error);

        showError(
            "Could not download this file. Check the storage policies."
        );
    } finally {
        button.disabled = false;
        button.textContent = "Download file";
    }
}

/* =====================================================
   VOICE MESSAGE PLAYER
===================================================== */

async function createVoicePlayer(voice) {
    const wrapper = document.createElement("div");

    wrapper.className = "voice-message-card";

    const heading = document.createElement("div");

    heading.className = "voice-message-heading";
    heading.textContent = "🎙️ Voice message";

    const duration = document.createElement("small");

    duration.className = "voice-duration";

    const seconds = Number(voice.duration_seconds || 0);

    duration.textContent = seconds > 0
        ? formatDuration(seconds)
        : "Audio message";

    const playButton = document.createElement("button");

    playButton.type = "button";
    playButton.className = "voice-load-button";
    playButton.textContent = "Load voice message";

    wrapper.append(heading, duration, playButton);

    let audio = null;
    let objectUrl = null;

    playButton.addEventListener("click", async () => {
        if (audio) {
            if (audio.paused) {
                try {
                    await audio.play();
                    playButton.textContent = "Pause";
                } catch (error) {
                    console.error("Audio playback error:", error);
                    showError("Could not play this voice message.");
                }
            } else {
                audio.pause();
                playButton.textContent = "Play";
            }

            return;
        }

        playButton.disabled = true;
        playButton.textContent = "Loading...";

        try {
            const { data, error } = await client.storage
                .from(VOICE_BUCKET)
                .download(voice.audio_path);

            if (error) throw error;

            objectUrl = makeObjectURL(data);

            audio = document.createElement("audio");

            audio.controls = true;
            audio.preload = "metadata";
            audio.className = "voice-player";
            audio.src = objectUrl;

            audio.addEventListener("play", () => {
                playButton.textContent = "Pause";
            });

            audio.addEventListener("pause", () => {
                playButton.textContent = "Play";
            });

            audio.addEventListener("ended", () => {
                playButton.textContent = "Play";
            });

            audio.addEventListener("error", () => {
                console.error("The browser could not decode this audio.");
            });

            wrapper.appendChild(audio);

            playButton.textContent = "Play";

        } catch (error) {
            console.error("Voice playback error:", error);

            playButton.textContent = "Retry loading voice";

            showError(
                "Could not load the voice message. Check the storage policies."
            );
        } finally {
            playButton.disabled = false;
        }
    });

    return wrapper;
}


function formatDuration(totalSeconds) {
    const seconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;

    return minutes + ":" + String(remainingSeconds).padStart(2, "0");
}

/* =====================================================
   VALIDATE ATTACHMENT
===================================================== */

function validateAttachment(file) {
    if (!file) {
        return "Choose a file first.";
    }

    if (file.size <= 0) {
        return "The selected file is empty.";
    }

    if (file.size > MAX_FILE_SIZE) {
        return "The maximum file size is 20 MB.";
    }

    const extension = getExtension(file.name);

    if (!ALLOWED_EXTENSIONS.has(extension)) {
        return "This file type is not supported.";
    }

    return null;
}

   FILE PICKER
===================================================== */

messageFile.addEventListener("change", () => {

    const problem = validateAttachment(file);

        showError(problem);
        return;
    }

});


/* =====================================================
   SEND PRIVATE ATTACHMENT
===================================================== */

async function sendAttachment(file, accompanyingText = "") {
    if (!currentConversation || !currentOtherUser) {
        showError("Select a conversation first.");
        return;
    }

    const validationError = validateAttachment(file);

    if (validationError) {
        showError(validationError);
        return;
    }

    if (attachmentBusy) return;

    setAttachmentBusy(true);

    let uploadedPath = null;
    let messageCreated = false;

    try {
        const safeName = makeSafeFilename(file.name);

        const uniqueName =
            Date.now() + "_" +
            crypto.randomUUID() + "_" +
            safeName;

        const filePath =
            "private/" +
            currentConversation.id + "/" +
            currentUser.id + "/" +
            uniqueName;

        const { data: uploadData, error: uploadError } =
            await client.storage
                .from(FILE_BUCKET)
                .upload(filePath, file, {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type || "application/octet-stream"
                });

        if (uploadError) throw uploadError;

        uploadedPath = uploadData.path;

        const { data: message, error: messageError } = await client
            .from("messages")
            .insert({
                conversation_id: currentConversation.id,
                sender_id: currentUser.id,
                receiver_id: currentOtherUser.id,
                message_text: accompanyingText || "📎 File attachment",
                is_read: false
            })
            .select()
            .single();

        if (messageError) throw messageError;

        messageCreated = true;

        const { error: metadataError } = await client
            .from("message_attachments")
            .insert({
                message_id: message.id,
                conversation_id: currentConversation.id,
                sender_id: currentUser.id,
                file_name: file.name,
                file_path: uploadedPath,
                file_type: file.type || null,
                file_size: file.size
            });

        if (metadataError) {
            console.error(
                "Attachment metadata error:",
                metadataError
            );

            throw metadataError;
        }

        messageInput.value = "";

        clearAttachmentPreview();

        await loadMessages(currentConversation.id);

        showSuccess("File shared successfully.");

    } catch (error) {
        console.error("Attachment upload error:", error);

        if (uploadedPath) {
            const { error: cleanupError } = await client.storage
                .from(FILE_BUCKET)
                .remove([uploadedPath]);

            if (cleanupError) {
                console.error("File cleanup error:", cleanupError);
            }
        }

        /*
         * If a message row was created but metadata failed,
         * remove the orphaned message when permissions allow.
         */
        if (messageCreated) {
            console.warn(
                "An attachment message was created before a later step failed."
            );
        }

        showError(
            error.message ||
            "Could not share the file. Check your storage and database policies."
        );

    } finally {
        setAttachmentBusy(false);
    }
}

   VOICE RECORDING

recordButton.addEventListener("click", async () => {

async function startVoiceRecording() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            showError(
                "Voice recording is not supported in this browser. Use HTTPS and allow microphone access."
            );

            return;
        }

        if (!window.MediaRecorder) {
            showError(
                "This browser does not support voice recording."
            );

            return;
        }

        recorderStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        recordedChunks = [];
        recordedVoiceBlob = null;
        recordedDurationSeconds = 0;

        const mimeTypes = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/mp4"
        ];

        const supportedType = mimeTypes.find(type => {
            return MediaRecorder.isTypeSupported(type);
        });

        const options = supportedType
            ? { mimeType: supportedType }
            : {};

        recorder = new MediaRecorder(recorderStream, options);

        recorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        recorder.onerror = event => {
            console.error("MediaRecorder error:", event.error);

            showError("An error occurred while recording audio.");
        };

        recorder.onstop = () => {
            recordedDurationSeconds = Math.max(
                1,
                Math.round((Date.now() - recordingStartedAt) / 1000)
            );

            recordedVoiceBlob = new Blob(recordedChunks, {
                type: recorder.mimeType || "audio/webm"
            });

            if (voicePreviewObjectUrl) {
                revokeObjectURL(voicePreviewObjectUrl);
            }

            voicePreviewObjectUrl = makeObjectURL(recordedVoiceBlob);

            voicePreviewPlayer.src = voicePreviewObjectUrl;

            voicePreview.classList.add("visible");

            recordingStatus.hidden = true;

            recordButton.textContent = "🎙️";

            stopRecorderStream();
        };

        recorder.start();

        recordingStartedAt = Date.now();

        recordingStatus.hidden = false;
        recordingStatus.textContent = "Recording voice message... 0s";

        recordButton.textContent = "⏹️";

        recordingTimer = setInterval(() => {
            if (!recordingStartedAt) return;

            const seconds = Math.floor(
                (Date.now() - recordingStartedAt) / 1000
            );

            recordingStatus.textContent =
                "Recording voice message... " + seconds + "s";
        }, 1000);

    } catch (error) {
        console.error("Recording error:", error);

        stopRecorderStream();

        showError(
            "Microphone access failed. Allow microphone permission and try again."
        );
    }
}


function stopRecorderStream() {
    if (recordingTimer) {
        clearInterval(recordingTimer);
        recordingTimer = null;
    }

    if (recorderStream) {
        recorderStream.getTracks().forEach(track => {
            track.stop();
        });

        recorderStream = null;
    }
}


/* =====================================================
   SEND VOICE MESSAGE
===================================================== */

sendVoiceButton.addEventListener("click", async () => {
    if (!recordedVoiceBlob || !currentConversation || !currentOtherUser) {
        showError("Record a voice message first.");
        return;
    }

    if (voiceBusy || attachmentBusy) return;

    voiceBusy = true;

    recordButton.disabled = true;
    sendVoiceButton.disabled = true;
    sendButton.disabled = true;

    let uploadedPath = null;

    try {
        const mimeType = recordedVoiceBlob.type || "audio/webm";

        let extension = "webm";

        if (mimeType.includes("mp4")) {
            extension = "m4a";
        } else if (mimeType.includes("ogg")) {
            extension = "ogg";
        }

        const filename =
            Date.now() + "_" +
            crypto.randomUUID() + "." +
            extension;

        const path =
            currentUser.id + "/" +
            currentConversation.id + "/" +
            filename;

        const { data: upload, error: uploadError } =
            await client.storage
                .from(VOICE_BUCKET)
                .upload(path, recordedVoiceBlob, {
                    upsert: false,
                    contentType: mimeType
                });

        if (uploadError) throw uploadError;

        uploadedPath = upload.path;

        const { data: message, error: messageError } = await client
            .from("messages")
            .insert({
                conversation_id: currentConversation.id,
                sender_id: currentUser.id,
                receiver_id: currentOtherUser.id,
                message_text: "",
                is_read: false
            })
            .select()
            .single();

        if (messageError) throw messageError;

        const { error: voiceError } = await client
            .from("voice_messages")
            .insert({
                message_id: message.id,
                sender_id: currentUser.id,
                conversation_id: currentConversation.id,
                audio_path: uploadedPath,
                audio_type: mimeType,
                duration_seconds: recordedDurationSeconds
            });

        if (voiceError) throw voiceError;

        resetVoicePreview();

        await loadMessages(currentConversation.id);

        showSuccess("Voice message sent.");

    } catch (error) {
        console.error("Voice send error:", error);

        if (uploadedPath) {
            const { error: cleanupError } = await client.storage
                .from(VOICE_BUCKET)
                .remove([uploadedPath]);

            if (cleanupError) {
                console.error("Voice cleanup error:", cleanupError);
            }
        }

        showError(
            error.message ||
            "Could not send the voice message."
        );

    } finally {
        voiceBusy = false;

        recordButton.disabled = attachmentBusy;
        sendVoiceButton.disabled = false;
        sendButton.disabled = attachmentBusy;
    }
});


/* =====================================================
   CANCEL VOICE PREVIEW
===================================================== */

cancelVoiceButton.addEventListener("click", resetVoicePreview);


function resetVoicePreview() {
    voicePreviewPlayer.pause();

    voicePreviewPlayer.removeAttribute("src");
    voicePreviewPlayer.load();

    if (voicePreviewObjectUrl) {
        revokeObjectURL(voicePreviewObjectUrl);
        voicePreviewObjectUrl = null;
    }

    voicePreview.classList.remove("visible");

    recordedVoiceBlob = null;
    recordedChunks = [];
    recordedDurationSeconds = 0;
    recordingStartedAt = 0;

    stopRecorderStream();

    recordingStatus.hidden = true;
    recordButton.textContent = "🎙️";
}


/* =====================================================
   READ RECEIPTS
===================================================== */

async function markMessagesRead(conversationId) {
    const { error } = await client
        .from("messages")
        .update({ is_read: true })
        .eq("conversation_id", conversationId)
        .eq("receiver_id", currentUser.id)
        .eq("is_read", false);

    if (error) {
        console.error("Read receipt update error:", error);
    }
}


/* =====================================================
   REALTIME UPDATES
===================================================== */

function subscribeToConversation(conversationId) {
    if (activeChannel) {
        client.removeChannel(activeChannel);
        activeChannel = null;
    }

    activeChannel = client
        .channel("private-messages-" + conversationId)

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "messages",
                filter: "conversation_id=eq." + conversationId
            },
            async payload => {
                if (
                    payload.eventType === "INSERT" &&
                    payload.new?.receiver_id === currentUser.id
                ) {
                    await markMessagesRead(conversationId);
                }

                if (currentConversation?.id === conversationId) {
                    await loadMessages(conversationId);
                }
            }
        )

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "message_attachments"
            },
            async payload => {
                const messageId =
                    payload.new?.message_id ||
                    payload.old?.message_id;

                if (!messageId) return;

                const message = messageCache.get(messageId);

                if (message?.conversation_id === conversationId) {
                    await loadMessages(conversationId);
                }
            }
        )

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "voice_messages"
            },
            async payload => {
                const messageId =
                    payload.new?.message_id ||
                    payload.old?.message_id;

                if (!messageId) return;

                const message = messageCache.get(messageId);

                if (message?.conversation_id === conversationId) {
                    await loadMessages(conversationId);
                }
            }
        )

        .subscribe(status => {
            console.log("Private message realtime:", status);
        });
}


/* =====================================================
   SEARCH
===================================================== */

searchUsers.addEventListener("input", () => {
    clearTimeout(searchTimeout);

    searchTimeout = setTimeout(() => {
        renderConversationList(searchUsers.value);
    }, 250);
});


/* =====================================================
   MOBILE NAVIGATION
===================================================== */

backButton.addEventListener("click", () => {
    messenger.classList.remove("chat-open");
});


/* =====================================================
   AUTHENTICATION AND INITIALIZATION
===================================================== */

async function initializeMessenger() {
    const {
        data: { session },
        error
    } = await client.auth.getSession();

    if (error) {
        console.error("Session verification error:", error);

        showError("Could not verify your login.");

        return;
    }

    if (!session) {
        window.location.href = "login.html";
        return;
    }

    currentUser = session.user;

    await loadConversations();

    if (refreshTimer) {
        clearInterval(refreshTimer);
    }

    /*
     * Fallback refresh if a realtime event is missed.
     */

    refreshTimer = setInterval(async () => {
        if (currentConversation) {
            await loadMessages(currentConversation.id);
        }
    }, 15000);
}


/* =====================================================
   AUTH STATE CHANGES
===================================================== */

client.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT" || !session) {
        window.location.href = "login.html";
    }
});


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener("beforeunload", () => {
    if (refreshTimer) {
        clearInterval(refreshTimer);
    }

    if (relativeTimeTimer) {
        clearInterval(relativeTimeTimer);
    }

    if (searchTimeout) {
        clearTimeout(searchTimeout);
    }

    stopRecorderStream();

    if (activeChannel) {
        client.removeChannel(activeChannel);
    }

    for (const url of objectUrls) {
        URL.revokeObjectURL(url);
    }

    objectUrls.clear();
});


/* =====================================================
   START APPLICATION
===================================================== */

initializeMessenger();
</script>
