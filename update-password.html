<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Password | cozmic</title>
    <meta name="theme-color" content="#0b1f3a">

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            color: #0b1f3a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 6%;
            background: #0b1f3a;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: #35e0d0;
            color: #0b1f3a;
        }

        .back-link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .page {
            min-height: calc(100vh - 68px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px 26px;
            border: 1px solid #e3eaf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(11, 31, 58, 0.08);
        }

        .icon {
            display: grid;
            place-items: center;
            width: 62px;
            height: 62px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #eaf2ff;
            color: #1769ff;
            font-size: 28px;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 26px;
        }

        .description {
            margin: 0 0 26px;
            color: #718096;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .password-wrap {
            display: flex;
            align-items: center;
            border: 1px solid #dce4ee;
            border-radius: 10px;
            overflow: hidden;
        }

        .password-wrap:focus-within {
            border-color: #1769ff;
            box-shadow: 0 0 0 3px rgba(23, 105, 255, 0.1);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 14px;
            border: 0;
            outline: none;
            background: #fff;
            color: #0b1f3a;
            font-size: 15px;
        }

        .toggle-password {
            flex-shrink: 0;
            padding: 12px;
            border: 0;
            background: #fff;
            color: #1769ff;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #1769ff;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #eafaf1;
            color: #16794b;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
        }

        .footer a {
            color: #1769ff;
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .topbar {
                padding: 12px 16px;
            }

            .brand {
                font-size: 17px;
            }

            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="brand">
        <span class="brand-icon"><img src="logo.jpg" alt="cozmic logo" class="brand-logo-image"></span>
        <span>cozmic</span>
    </a>

    <a href="login.html" class="back-link">Back to Login</a>
</header>

<main class="page">
    <section class="card">

        <div class="icon">🔐</div>

        <h1>Create New Password</h1>

        <p class="description">
            Choose a strong new password for your cozmic account.
        </p>

        <form id="updatePasswordForm">

            <div class="field">
                <label for="newPassword">New Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="At least 8 characters"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="newPassword">
                        Show
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Enter password again"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword">
                        Show
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="updateButton"
                class="submit-button">
                Update Password
            </button>

            <div
                id="formMessage"
                class="message"
                role="status"
                aria-live="polite">
            </div>

        </form>

        <div class="footer">
            <a href="login.html">Return to Login</a>
        </div>

    </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    const form = document.getElementById("updatePasswordForm");
    const passwordInput = document.getElementById("newPassword");
    const confirmInput = document.getElementById("confirmPassword");
    const updateButton = document.getElementById("updateButton");
    const message = document.getElementById("formMessage");

    function getClient() {
        if (window.supabaseClient?.auth) {
            return window.supabaseClient;
        }

        if (window.CNS_SUPABASE?.auth) {
            return window.CNS_SUPABASE;
        }

        if (
            window.supabase &&
            typeof window.supabase.createClient === "function"
        ) {
            const url =
                typeof SUPABASE_URL !== "undefined"
                    ? SUPABASE_URL
                    : null;

            const key =
                typeof SUPABASE_PUBLISHABLE_KEY !== "undefined"
                    ? SUPABASE_PUBLISHABLE_KEY
                    : (
                        typeof SUPABASE_ANON_KEY !== "undefined"
                            ? SUPABASE_ANON_KEY
                            : null
                    );

            if (url && key) {
                window.CNS_SUPABASE =
                    window.supabase.createClient(url, key);

                return window.CNS_SUPABASE;
            }
        }

        return null;
    }

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    document.querySelectorAll(".toggle-password").forEach(function (button) {
        button.addEventListener("click", function () {
            const input = document.getElementById(button.dataset.target);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Hide";
            } else {
                input.type = "password";
                button.textContent = "Show";
            }
        });
    });

    const client = getClient();

    if (!client) {
        showMessage(
            "Supabase could not be initialized. Check supabase-config.js.",
            "error"
        );
        updateButton.disabled = true;
        return;
    }

    /*
     * Supabase normally processes the recovery link and establishes
     * a recovery session. We wait briefly for that session before
     * allowing the user to update the password.
     */
    let recoveryReady = false;

    const { data: initialData, error: initialError } =
        await client.auth.getSession();

    if (initialError) {
        console.error(initialError);
    }

    if (initialData?.session) {
        recoveryReady = true;
    }

    client.auth.onAuthStateChange(function (event, session) {
        if (
            event === "PASSWORD_RECOVERY" ||
            (event === "SIGNED_IN" && session)
        ) {
            recoveryReady = true;
            message.className = "message";
            message.textContent = "";
            updateButton.disabled = false;
        }

        if (event === "SIGNED_OUT") {
            recoveryReady = false;
        }
    });

    if (!recoveryReady) {
        showMessage(
            "We could not confirm your recovery session. Open the latest password recovery email and use its link to access this page.",
            "error"
        );
        updateButton.disabled = true;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = passwordInput.value;
        const confirmation = confirmInput.value;

        if (password.length < 8) {
            showMessage(
                "Your new password must contain at least 8 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmation) {
            showMessage(
                "The passwords do not match. Please check them.",
                "error"
            );
            return;
        }

        if (!recoveryReady) {
            showMessage(
                "Your recovery session is not active. Open the latest recovery email link again.",
                "error"
            );
            return;
        }

        updateButton.disabled = true;
        updateButton.textContent = "Updating Password...";

        try {
            const { error } = await client.auth.updateUser({
                password: password
            });

            if (error) {
                throw error;
            }

            showMessage(
                "Your password has been updated successfully. You can now log in using your new password.",
                "success"
            );

            form.reset();

            if (typeof Swal !== "undefined") {
                await Swal.fire({
                    icon: "success",
                    title: "Password Updated",
                    text: "Your password has been changed successfully.",
                    confirmButtonColor: "#1769ff"
                });
            }

            await client.auth.signOut();

            window.location.replace("login.html");

        } catch (error) {
            console.error("Password update error:", error);

            showMessage(
                error.message ||
                "We could not update your password. Request a new recovery email and try again.",
                "error"
            );

            updateButton.disabled = false;

        } finally {
            updateButton.textContent = "Update Password";
        }
    });

});
</script>

</body>
</html>
