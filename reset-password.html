<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | cozmic</title>

    <meta name="theme-color" content="#0b1f3a">
    <meta name="description" content="Reset your cozmic account password securely.">

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>

    <style>
        :root {
            --navy: #0b1f3a;
            --blue: #1769ff;
            --aqua: #35e0d0;
            --white: #ffffff;
            --muted: #718096;
            --border: #e3eaf2;
            --background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--navy);
            font-family: Arial, Helvetica, sans-serif;
        }

        .reset-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            min-height: 72px;
            padding: 12px 6%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 4px 18px rgba(11, 31, 58, 0.12);
        }

        .reset-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white);
            text-decoration: none;
            font-size: 21px;
            font-weight: 800;
        }

        .reset-brand-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--aqua);
            color: var(--navy);
            font-weight: 900;
            font-size: 20px;
        }

        .reset-nav-link {
            padding: 10px 17px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 9px;
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .reset-nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .reset-page {
            min-height: calc(100vh - 72px);
            padding: 45px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            padding: 38px 32px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(11, 31, 58, 0.08);
        }

        .reset-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf2ff;
            color: var(--blue);
            border-radius: 20px;
        }

        .reset-icon svg {
            width: 34px;
            height: 34px;
        }

        .reset-card h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 27px;
            letter-spacing: -0.7px;
        }

        .reset-description {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            display: block;
            width: 100%;
            min-height: 49px;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--navy);
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23, 105, 255, 0.1);
        }

        .reset-button {
            width: 100%;
            min-height: 50px;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            background: var(--blue);
            color: var(--white);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .reset-button:hover {
            background: #0755dc;
        }

        .reset-button:active {
            transform: scale(0.99);
        }

        .reset-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .form-message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .form-message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
        }

        .form-message.success {
            display: block;
            background: #eafaf1;
            color: #16794b;
        }

        .reset-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.8;
        }

        .reset-footer a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }

        .reset-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-navbar {
                min-height: 64px;
                padding: 10px 16px;
            }

            .reset-brand {
                font-size: 18px;
            }

            .reset-brand-icon {
                width: 37px;
                height: 37px;
                font-size: 18px;
            }

            .reset-nav-link {
                padding: 9px 12px;
                font-size: 13px;
            }

            .reset-page {
                min-height: calc(100vh - 64px);
                padding: 28px 14px;
            }

            .reset-card {
                padding: 30px 22px;
                border-radius: 16px;
            }

            .reset-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header class="reset-navbar">
        <a href="index.html" class="reset-brand">
            <span class="reset-brand-icon"><img src="logo.jpg" alt="cozmic logo" class="brand-logo-image"></span>
            <span>cozmic</span>
        </a>

        <a href="login.html" class="reset-nav-link">
            Back to Login
        </a>
    </header>

    <main class="reset-page">

        <section class="reset-card">

            <div class="reset-icon">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">

                    <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                    <path d="m4 7 8 6 8-6"></path>
                    <path d="M16 3v4"></path>
                </svg>
            </div>

            <h1>Forgot your password?</h1>

            <p class="reset-description">
                Don't worry. Enter the email address associated with your
                cozmic account, and we'll send you a password recovery link.
            </p>

            <form id="resetPasswordForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required>
                </div>

                <button
                    type="submit"
                    id="resetButton"
                    class="reset-button">

                    Send Reset Link
                </button>

                <div
                    id="formMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite">
                </div>

            </form>

            <div class="reset-footer">
                Remember your password?
                <a href="login.html">Log in</a>
                <br>
                New to cozmic?
                <a href="register.html">Create an account</a>
            </div>

        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const form = document.getElementById("resetPasswordForm");
            const emailInput = document.getElementById("email");
            const resetButton = document.getElementById("resetButton");
            const formMessage = document.getElementById("formMessage");

            function showMessage(message, type) {
                formMessage.textContent = message;
                formMessage.className = "form-message " + type;
            }

            function getSupabaseClient() {
                if (
                    window.supabaseClient &&
                    typeof window.supabaseClient.auth !== "undefined"
                ) {
                    return window.supabaseClient;
                }

                if (
                    window.CNS_SUPABASE &&
                    typeof window.CNS_SUPABASE.auth !== "undefined"
                ) {
                    return window.CNS_SUPABASE;
                }

                if (
                    window.supabase &&
                    typeof window.supabase.createClient === "function"
                ) {
                    const url =
                        typeof SUPABASE_URL !== "undefined"
                            ? SUPABASE_URL
                            : null;

                    const key =
                        typeof SUPABASE_PUBLISHABLE_KEY !== "undefined"
                            ? SUPABASE_PUBLISHABLE_KEY
                            : (
                                typeof SUPABASE_ANON_KEY !== "undefined"
                                    ? SUPABASE_ANON_KEY
                                    : null
                            );

                    if (url && key) {
                        window.CNS_SUPABASE =
                            window.supabase.createClient(url, key);

                        return window.CNS_SUPABASE;
                    }
                }

                return null;
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                const email = emailInput.value.trim().toLowerCase();

                if (!email) {
                    showMessage(
                        "Please enter your registered email address.",
                        "error"
                    );
                    return;
                }

                const client = getSupabaseClient();

                if (!client) {
                    showMessage(
                        "Supabase could not be initialized. Check your supabase-config.js file.",
                        "error"
                    );
                    return;
                }

                resetButton.disabled = true;
                resetButton.textContent = "Sending...";
                formMessage.className = "form-message";
                formMessage.textContent = "";

                try {
                    const recoveryURL = new URL(
    "update-password.html",
    window.location.href
).href;

                    const { error } = await client.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo: recoveryURL
                        }
                    );

                    if (error) {
                        throw error;
                    }

                    showMessage(
                        "If an account exists for this email, a password recovery email will be sent. Check your inbox and spam folder.",
                        "success"
                    );

                    if (typeof Swal !== "undefined") {
                        Swal.fire({
                            icon: "success",
                            title: "Check Your Email",
                            text: "If an account exists for this email, a password recovery email will be sent.",
                            confirmButtonColor: "#1769ff"
                        });
                    }

                } catch (error) {
                    console.error("Password recovery error:", error);

                    showMessage(
                        error.message ||
                        "We could not send the recovery email. Please try again.",
                        "error"
                    );

                } finally {
                    resetButton.disabled = false;
                    resetButton.textContent = "Send Reset Link";
                }
            });

        });
    </script>

</body>
</html>
