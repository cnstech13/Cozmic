<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friends | cozmic</title>

    <link rel="stylesheet" href="global.css">

    <style>
        :root {
            --navy: #0b1f3a;
            --blue: #1769ff;
            --aqua: #35e0d0;
            --bg: #f3f6fb;
            --text: #18243a;
            --muted: #68758a;
            --border: #e4eaf2;
            --green: #159957;
            --red: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .friends-container {
            width: min(100%, 1000px);
            margin: 0 auto;
            padding: 20px 15px 40px;
        }

        .friends-header {
            padding: 25px;
            border-radius: 18px;
            color: white;
            background: linear-gradient(
                135deg,
                var(--navy),
                var(--blue)
            );
            margin-bottom: 20px;
        }

        .friends-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .friends-header p {
            margin: 0;
            line-height: 1.6;
            color: #e5edff;
        }

        .friends-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .friends-nav a {
            display: inline-block;
            text-decoration: none;
            color: var(--navy);
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .friends-nav a.active {
            color: white;
            background: var(--blue);
            border-color: var(--blue);
        }

        .friends-section {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(11, 31, 58, 0.04);
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 19px;
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 27px;
            height: 27px;
            padding: 0 8px;
            border-radius: 20px;
            color: var(--blue);
            background: #eaf1ff;
            font-size: 12px;
            font-weight: bold;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-row input {
            min-width: 0;
            flex: 1;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .search-row input:focus {
            border-color: var(--blue);
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 10px 13px;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-primary {
            color: white;
            background: var(--blue);
        }

        .btn-success {
            color: white;
            background: var(--green);
        }

        .btn-danger {
            color: white;
            background: var(--red);
        }

        .btn-light {
            color: var(--navy);
            background: #edf2f8;
        }

        .btn-outline {
            color: var(--blue);
            background: white;
            border: 1px solid var(--blue);
        }

        .user-list {
            display: grid;
            gap: 12px;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 13px;
            min-width: 0;
        }

        .user-avatar {
            width: 49px;
            height: 49px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(
                135deg,
                var(--navy),
                var(--blue)
            );
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .user-details h3 {
            margin: 0 0 5px;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .user-details p {
            margin: 0;
            font-size: 12px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .user-actions {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 7px;
        }

        .empty-state {
            text-align: center;
            padding: 25px 10px;
            color: var(--muted);
            line-height: 1.7;
        }

        .empty-state strong {
            display: block;
            color: var(--navy);
            margin-bottom: 5px;
        }

        .loading {
            padding: 18px;
            text-align: center;
            color: var(--muted);
        }

        .friends-notice {
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            background: #e8f5ff;
            color: #174c7c;
            line-height: 1.6;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .friends-container {
                padding: 12px 10px 30px;
            }

            .friends-header {
                padding: 20px;
            }

            .friends-header h1 {
                font-size: 23px;
            }

            .friends-section {
                padding: 14px;
            }

            .user-card {
                flex-wrap: wrap;
            }

            .user-details {
                flex-basis: calc(100% - 75px);
            }

            .user-actions {
                width: 100%;
                justify-content: flex-start;
                padding-left: 61px;
            }

            .search-row {
                flex-wrap: wrap;
            }

            .search-row input {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="friends-container">

        <header class="friends-header">
            <h1>👥 My Friends</h1>
            
        </header>

        <nav class="friends-nav">
            <a href="index.html">Home</a>
            <a href="users.html">Discover Users</a>
            <a href="friends.html" class="active">Friends</a>
            <a href="videos.html">Videos</a>
            <a href="messages.html">Messages</a>
        </nav>

        

        <section class="friends-section">
            <div class="section-heading">
                <h2>Find People</h2>
            </div>

            <div class="search-row">
                <input
                    type="search"
                    id="userSearchInput"
                    placeholder="Search by name or email..."
                    autocomplete="off"
                >

                <button
                    class="btn btn-primary"
                    id="searchUsersButton"
                >
                    Search
                </button>
            </div>

            <div id="searchResults" class="user-list">
                <div class="empty-state">
                    <strong>Find your next connection</strong>
                    Search for users to send friend requests.
                </div>
            </div>
        </section>

        <section class="friends-section">
            <div class="section-heading">
                <h2>Incoming Requests</h2>
                <span class="count-badge" id="incomingCount">0</span>
            </div>

            <div id="incomingRequests" class="user-list">
                <div class="loading">
                    Loading incoming requests...
                </div>
            </div>
        </section>

        <section class="friends-section">
            <div class="section-heading">
                <h2>Sent Requests</h2>
                <span class="count-badge" id="sentCount">0</span>
            </div>

            <div id="sentRequests" class="user-list">
                <div class="loading">
                    Loading sent requests...
                </div>
            </div>
        </section>

        <section class="friends-section">
            <div class="section-heading">
                <h2>My Friends</h2>
                <span class="count-badge" id="friendsCount">0</span>
            </div>

            <div id="friendsList" class="user-list">
                <div class="loading">
                    Loading your friends...
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase-config.js"></script>
    <script src="friends.js"></script>

</body>
</html>
