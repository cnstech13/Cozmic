<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Group Chat | Cozmic</title>

    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Cozmic configuration -->
    <script src="./supabase-config.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            if (window.supabaseClient) {
                console.log("Cozmic: Supabase client is ready.");
            } else {
                console.error(
                    "Cozmic: Supabase is not initialized. Check supabase-config.js."
                );
            }
        });
    </script>

    <link rel="stylesheet" href="global.css">

    <style>
        /* =========================================
           COZMIC — BRIGHT GROUP CHAT DESIGN
           White • Lavender • Cyan • Purple
        ========================================= */

        :root {
            --primary: #7957f5;
            --primary-dark: #6342e7;
            --primary-soft: #f1edff;

            --cyan: #32cfc0;
            --cyan-soft: #e8fbf8;

            --background: #f7f8fd;
            --surface: #ffffff;
            --surface-soft: #fbfaff;

            --text: #252641;
            --muted: #858ba5;
            --border: #ececf5;
            --danger: #e44860;

            --shadow:
                0 8px 30px rgba(70, 60, 130, 0.055);

            --radius: 20px;
        }

        /* =========================================
           RESET
        ========================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 0% 0%,
                    rgba(121, 87, 245, 0.055),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(50, 207, 192, 0.055),
                    transparent 25%
                ),
                var(--background);

            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(121, 87, 245, 0.25);
            outline-offset: 3px;
        }

        img,
        video,
        audio {
            max-width: 100%;
        }

        /* =========================================
           TOP HEADER
        ========================================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;

            width: 100%;
            min-width: 0;
            min-height: 76px;

            display: flex;
            align-items: center;
            gap: 14px;

            padding:
                13px
                max(16px, calc((100% - 1400px) / 2));

            color: var(--text);
            background: rgba(255, 255, 255, 0.96);

            border-bottom: 1px solid var(--border);

            box-shadow:
                0 4px 20px rgba(60, 50, 110, 0.035);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .topbar button {
            min-height: 42px;
            padding: 10px 13px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            border: 1px solid transparent;
            border-radius: 12px;

            font-size: 13px;
            font-weight: 750;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .topbar button:active {
            transform: scale(0.97);
        }

        .back {
            flex-shrink: 0;

            color: var(--primary);
            background: var(--primary-soft);
            border-color: #e7e0ff !important;
        }

        .back:hover {
            background: #e7e0ff;
        }

        .brand-mark {
            width: 45px;
            height: 45px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 15px;

            color: #ffffff;
            background: linear-gradient(
                145deg,
                #a28bff,
                #7654f5
            );

            font-size: 22px;
            font-weight: 900;

            box-shadow:
                0 5px 15px rgba(121, 87, 245, 0.17);
        }

        .group-title {
            flex: 1;
            min-width: 0;
        }

        .group-title h1 {
            margin: 0 0 5px;

            font-size: 19px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -0.4px;

            overflow-wrap: anywhere;
        }

        .group-title p {
            margin: 0;

            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;

            display: inline-block;

            border-radius: 50%;
            background: var(--cyan);

            box-shadow:
                0 0 0 4px rgba(50, 207, 192, 0.12);
        }

        #refreshButton {
            flex-shrink: 0;

            color: #ffffff;
            background: linear-gradient(
                135deg,
                #8a6cff,
                #7352f1
            );

            box-shadow:
                0 4px 13px rgba(121, 87, 245, 0.16);
        }

        #refreshButton:hover {
            background: var(--primary-dark);
        }

        /* =========================================
           MAIN LAYOUT
        ========================================= */

        .layout {
            width: 100%;
            max-width: 1400px;

            margin: 25px auto;
            padding: 0 20px;

            display: grid;
            grid-template-columns: minmax(235px, 285px) minmax(0, 1fr);

            gap: 20px;
            align-items: stretch;
        }

        .panel {
            min-width: 0;
            max-width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .panel-head {
            min-height: 72px;
            padding: 17px 19px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            background: #ffffff;
            border-bottom: 1px solid var(--border);
        }

        .panel-heading {
            display: flex;
            flex-direction: column;
            gap: 5px;

            min-width: 0;
        }

        .panel-heading strong {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.4;
        }

        .panel-heading small {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        #addMembersButton {
            flex-shrink: 0;

            padding: 9px 12px;

            color: var(--primary);
            background: var(--primary-soft);

            border: 1px solid #e8e0ff;
            border-radius: 11px;

            font-size: 12px;
            font-weight: 800;

            transition: background 0.2s ease;
        }

        #addMembersButton:hover {
            background: #e7e0ff;
        }

        /* =========================================
           MEMBERS
        ========================================= */

        #membersList {
            min-width: 0;
            padding: 10px 13px 17px;
        }

        .member {
            position: relative;

            min-width: 0;
            max-width: 100%;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 12px 8px;
            margin: 2px 0;

            border-bottom: 1px solid #f2f1f8;
            border-radius: 12px;

            transition: background 0.2s ease;
        }

        .member:last-child {
            border-bottom-color: transparent;
        }

        .member:hover {
            background: #faf8ff;
        }

        .avatar {
            position: relative;

            width: 43px;
            height: 43px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            overflow: hidden;

            border-radius: 15px;

            color: #ffffff;
            background: linear-gradient(
                145deg,
                #a18aff,
                #7554ef
            );

            font-size: 13px;
            font-weight: 850;
        }

        .avatar img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-details {
            flex: 1;
            min-width: 0;
        }

        .member-name {
            color: var(--text);

            font-size: 13px;
            font-weight: 750;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .you-label {
            color: var(--primary);
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .member-role {
            margin-top: 4px;

            color: var(--muted);

            font-size: 11px;
            line-height: 1.4;
            text-transform: capitalize;

            overflow-wrap: anywhere;
        }

        /* =========================================
           PROFILE LINKS
        ========================================= */

        .profile-name-link {
            color: inherit;
            text-decoration: none;
            font-weight: inherit;

            overflow-wrap: anywhere;
        }

        .profile-name-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .profile-name-link:focus-visible,
        .profile-avatar-link:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
            border-radius: 7px;
        }

        .profile-avatar-link {
            display: inline-flex;
            flex-shrink: 0;

            color: inherit;
            text-decoration: none;

            border-radius: 15px;
        }

        .profile-avatar-link:hover .avatar,
        .profile-avatar-link:hover .message-avatar {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* =========================================
           CHAT PANEL
        ========================================= */

        .chat-panel {
            min-width: 0;
            min-height: 620px;

            display: flex;
            flex-direction: column;
        }

        .chat-info {
            min-height: 47px;
            padding: 12px 18px;

            display: flex;
            align-items: center;
            gap: 9px;

            color: #737891;
            background: #fcfbff;

            border-bottom: 1px solid var(--border);

            font-size: 12px;
            line-height: 1.6;

            overflow-wrap: anywhere;
        }

        .chat-info::before {
            content: "✦";
            flex-shrink: 0;

            color: var(--primary);
            font-size: 15px;
        }

        #messagesArea {
            width: 100%;
            min-width: 0;
            flex: 1;

            min-height: 360px;
            max-height: 64vh;
            max-height: 64dvh;

            padding: 23px 20px;

            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 19px;

            overflow-x: hidden;
            overflow-y: auto;

            overscroll-behavior: contain;
            scroll-behavior: smooth;

            background:
                radial-gradient(
                    circle at 0 0,
                    rgba(121, 87, 245, 0.035),
                    transparent 30%
                ),
                #ffffff;
        }

        #messagesArea::-webkit-scrollbar {
            width: 5px;
        }

        #messagesArea::-webkit-scrollbar-track {
            background: transparent;
        }

        #messagesArea::-webkit-scrollbar-thumb {
            background: #e2def5;
            border-radius: 20px;
        }

        /* =========================================
           MESSAGE ROWS
        ========================================= */

        .message-row {
            width: fit-content;
            max-width: 88%;
            min-width: 0;

            align-self: flex-start;

            display: flex;
            align-items: flex-end;
            gap: 9px;
        }

        .message-row.mine {
            align-self: flex-end;
            flex-direction: row-reverse;

            margin-left: auto;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            overflow: hidden;

            border-radius: 12px;

            color: #ffffff;
            background: linear-gradient(
                145deg,
                #a18aff,
                #7654f2
            );

            font-size: 11px;
            font-weight: 850;
        }

        .message-avatar img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-main {
            width: fit-content;
            max-width: 100%;
            min-width: 0;

            flex: 0 1 auto;
        }

        .message-meta {
            max-width: 100%;
            min-width: 0;

            margin: 0 5px 7px;

            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;

            color: var(--muted);

            font-size: 11px;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .message-row.mine .message-meta {
            justify-content: flex-end;
        }

        .bubble {
            width: fit-content;
            min-width: 60px;
            max-width: 100%;

            padding: 12px 15px;

            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: break-word;

            color: var(--text);
            background: #f5f3ff;

            border: 1px solid #eee9ff;
            border-radius: 5px 17px 17px 17px;

            box-shadow:
                0 3px 10px rgba(70, 60, 130, 0.025);
        }

        .message-row.mine .bubble {
            color: #ffffff;

            background: linear-gradient(
                135deg,
                #8a6cff,
                #7352ef
            );

            border-color: transparent;
            border-radius: 17px 5px 17px 17px;

            box-shadow:
                0 5px 14px rgba(121, 87, 245, 0.13);
        }

        .message-content {
            max-width: 100%;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;

            font-size: 14px;
            line-height: 1.65;
        }

        .message-row.mine .message-meta {
            color: #858ba5;
        }

        .message-row.mine .message-meta .profile-name-link {
            color: #858ba5;
        }

        .message-row.mine .bubble .message-content {
            color: #ffffff;
        }

        .message-actions {
            margin-top: 8px;

            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }

        .message-actions button {
            max-width: 100%;
            padding: 5px 7px;

            color: #747991;
            background: transparent;

            border: 0;
            border-radius: 7px;

            font-size: 11px;
        }

        .message-actions button:hover {
            background: var(--primary-soft);
        }

        .message-actions button.delete {
            color: var(--danger);
        }

        .edited {
            color: var(--muted);
            font-size: 10px;
        }

        /* =========================================
           FILE ATTACHMENTS
        ========================================= */

        .group-file-card {
            width: min(300px, 100%);
            min-width: 0;
            max-width: 100%;

            overflow: hidden;

            background: #ffffff;

            border: 1px solid var(--border);
            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(70, 60, 130, 0.04);
        }

        .group-file-preview {
            display: block;

            width: 100%;
            max-width: 100%;
            max-height: 230px;

            object-fit: contain;
            background: #f8f7ff;
        }

        .group-file-info {
            min-width: 0;
            padding: 12px;
        }

        .group-file-name {
            color: var(--text);

            font-size: 13px;
            font-weight: 800;
            line-height: 1.5;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .group-file-details {
            margin-top: 5px;

            color: var(--muted);

            font-size: 11px;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .group-file-actions {
            margin-top: 11px;

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .group-file-download,
        .group-file-delete {
            max-width: 100%;
            padding: 8px 10px;

            color: var(--primary);
            background: var(--primary-soft);

            border: 0;
            border-radius: 9px;

            font-size: 12px;
            font-weight: 750;

            overflow-wrap: anywhere;
        }

        .group-file-delete {
            color: #c62840;
            background: #fff0f2;
        }

        .voice-player {
            display: block;

            width: min(280px, 100%);
            max-width: 100%;
            min-width: 0;
        }

        .system-message {
            max-width: 100%;
            padding: 12px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.7;
            text-align: center;

            overflow-wrap: anywhere;
        }

        /* =========================================
           MESSAGE COMPOSER
        ========================================= */

        .composer {
            min-width: 0;
            padding: 16px;

            background: #ffffff;
            border-top: 1px solid var(--border);
        }

        .composer form {
            min-width: 0;

            display: flex;
            align-items: flex-end;
            gap: 9px;
        }

        .composer textarea {
            flex: 1;
            min-width: 0;

            min-height: 47px;
            max-height: 140px;

            resize: vertical;

            padding: 13px 15px;

            color: var(--text);
            background: #fafaff;

            border: 1px solid #e9e7f5;
            border-radius: 15px;

            font-size: 14px;
            line-height: 1.5;

            overflow-wrap: anywhere;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .composer textarea::placeholder {
            color: #a0a3b7;
        }

        .composer textarea:focus {
            outline: none;

            background: #ffffff;
            border-color: #b4a4ff;

            box-shadow:
                0 0 0 4px rgba(121, 87, 245, 0.07);
        }

        .action-btn {
            min-height: 45px;
            min-width: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            padding: 10px 13px;

            border: 0;
            border-radius: 12px;

            font-size: 12px;
            font-weight: 800;
            line-height: 1.4;

            white-space: nowrap;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .file-btn {
            color: #6250a4;
            background: #f1edff;
        }

        .file-btn:hover {
            background: #e7e0ff;
        }

        .voice-btn {
            color: #078578;
            background: #e7faf5;
        }

        .voice-btn:hover {
            background: #d7f5ed;
        }

        .send-btn {
            flex-shrink: 0;

            color: #ffffff;
            background: linear-gradient(
                135deg,
                #8a6cff,
                #7352ef
            );

            box-shadow:
                0 4px 12px rgba(121, 87, 245, 0.14);
        }

        .send-btn:hover {
            background: var(--primary-dark);
        }

        /* =========================================
           ADD MEMBERS MODAL
        ========================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 16px;

            background: rgba(45, 35, 85, 0.38);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 440px;
            max-height: 85vh;
            max-height: 85dvh;

            overflow-x: hidden;
            overflow-y: auto;

            padding: 24px;

            background: #ffffff;

            border: 1px solid #eeebfa;
            border-radius: 21px;

            box-shadow:
                0 20px 60px rgba(40, 30, 90, 0.15);

            animation: modalEnter 0.2s ease-out;
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal h2 {
            margin: 0 0 12px;

            color: var(--text);

            font-size: 21px;
            line-height: 1.35;
            letter-spacing: -0.4px;
        }

        .modal p {
            color: var(--muted);

            font-size: 13px;
            line-height: 1.7;
        }

        .modal label {
            display: block;
            margin-top: 18px;

            color: var(--text);

            font-size: 12px;
            font-weight: 800;
        }

        .modal input {
            display: block;

            width: 100%;
            min-width: 0;
            min-height: 47px;

            margin: 8px 0 16px;
            padding: 12px 14px;

            color: var(--text);
            background: #fafaff;

            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .modal input:focus {
            outline: none;
            border-color: #b4a4ff;

            box-shadow:
                0 0 0 4px rgba(121, 87, 245, 0.07);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 9px;
        }

        .secondary-btn {
            color: #656b85;
            background: #f1f1f8;
        }

        .primary-btn {
            color: #ffffff;
            background: linear-gradient(
                135deg,
                #8a6cff,
                #7352ef
            );
        }

        /* =========================================
           FOOTER
        ========================================= */

        .page-footer {
            padding: 0 15px 23px;

            color: #999bb1;

            text-align: center;
            font-size: 11px;
            line-height: 1.7;
            letter-spacing: 0.2px;
        }

        .page-footer strong {
            color: var(--primary);
        }

        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 950px) {
            .layout {
                grid-template-columns:
                    minmax(210px, 250px)
                    minmax(0, 1fr);

                gap: 14px;
                padding: 0 14px;
            }

            .topbar {
                gap: 10px;
            }

            #messagesArea {
                padding: 18px 14px;
            }

            .composer {
                padding: 13px;
            }

            .composer form {
                flex-wrap: wrap;
            }

            .composer textarea {
                flex-basis: 100%;
                order: -1;
            }

            .action-btn {
                padding: 10px 11px;
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 760px) {
            .topbar {
                min-height: 68px;
                padding: 10px 12px;
                gap: 9px;
            }

            .topbar button {
                min-height: 39px;
                padding: 8px 10px;
                font-size: 11px;
            }

            .brand-mark {
                display: none;
            }

            .group-title {
                flex: 1;
            }

            .group-title h1 {
                margin-bottom: 4px;
                font-size: 15px;
            }

            .group-title p {
                font-size: 10px;
            }

            .layout {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;

                margin: 13px auto;
                padding: 0 10px;
            }

            .chat-panel {
                order: 1;

                min-height: 0;
                min-height: 65dvh;

                border-radius: 17px;
            }

            .members-panel {
                order: 2;
                border-radius: 17px;
            }

            .panel-head {
                min-height: 62px;
                padding: 13px 14px;
            }

            .panel-heading strong {
                font-size: 14px;
            }

            .chat-info {
                padding: 10px 12px;
                font-size: 11px;
            }

            #messagesArea {
                min-height: 280px;
                max-height: 52vh;
                max-height: 52dvh;

                padding: 15px 9px;
                gap: 16px;
            }

            .message-row {
                max-width: 96%;
                gap: 6px;
            }

            .message-avatar {
                width: 28px;
                height: 28px;
                border-radius: 9px;
                font-size: 9px;
            }

            .message-meta {
                gap: 5px;
                margin: 0 4px 6px;
                font-size: 10px;
            }

            .bubble {
                min-width: 0;
                padding: 10px 12px;
                border-radius: 5px 14px 14px 14px;
            }

            .message-row.mine .bubble {
                border-radius: 14px 5px 14px 14px;
            }

            .message-content {
                font-size: 13px;
                line-height: 1.6;
            }

            /* Keep the composer inside the screen */
            .composer {
                padding: 11px 9px;
            }

            .composer form {
                display: grid;

                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(0, 1fr)
                    minmax(0, 1fr);

                align-items: center;
                gap: 7px;
            }

            .composer textarea {
                grid-column: 1 / -1;
                grid-row: 1;

                width: 100%;
                min-width: 0;
                min-height: 47px;
                max-height: 110px;

                padding: 12px 13px;

                resize: vertical;
                order: initial;
            }

            .file-btn {
                grid-column: 1;
                grid-row: 2;
            }

            .voice-btn {
                grid-column: 2;
                grid-row: 2;
            }

            .send-btn {
                grid-column: 3;
                grid-row: 2;
            }

            .action-btn {
                width: 100%;
                min-width: 0;
                min-height: 42px;

                padding: 9px 5px;

                border-radius: 11px;

                font-size: 11px;
                white-space: normal;
                text-align: center;
            }

            .group-file-card {
                width: min(270px, 100%);
            }

            .voice-player {
                width: min(240px, 100%);
            }

            .modal {
                padding: 20px;
                border-radius: 18px;
            }
        }

        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {
            .topbar {
                padding: 9px 7px;
                gap: 6px;
            }

            .topbar button {
                padding: 7px;
                font-size: 10px;
            }

            .group-title h1 {
                font-size: 13px;
            }

            .group-title p {
                font-size: 9px;
            }

            .layout {
                padding: 0 7px;
            }

            #messagesArea {
                padding: 13px 7px;
            }

            .message-row {
                max-width: 98%;
                gap: 5px;
            }

            .message-avatar {
                width: 24px;
                height: 24px;
            }

            .bubble {
                padding: 9px 10px;
            }

            .action-btn {
                padding: 8px 3px;
                font-size: 10px;
            }

            .panel-head {
                gap: 7px;
            }

            #addMembersButton {
                padding: 8px 9px;
                font-size: 11px;
            }
        }

        /* =========================================
           EXTRA NARROW SCREENS
        ========================================= */

        @media (max-width: 300px) {
            .topbar {
                flex-wrap: wrap;
            }

            .group-title {
                flex-basis: 100%;
                order: 3;
            }

            .layout {
                padding: 0 5px;
            }

            .composer form {
                grid-template-columns: minmax(0, 1fr);
            }

            .composer textarea,
            .file-btn,
            .voice-btn,
            .send-btn {
                grid-column: 1;
            }

            .composer textarea {
                grid-row: 1;
            }

            .file-btn {
                grid-row: 2;
            }

            .voice-btn {
                grid-row: 3;
            }

            .send-btn {
                grid-row: 4;
            }
        }

        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="topbar">

        <button class="back" id="backButton" type="button">
            <span aria-hidden="true">←</span>
            <span>Back</span>
        </button>

        <div class="brand-mark" aria-hidden="true">C</div>

        <div class="group-title">
            <h1 id="groupName">Group chat</h1>

            <p id="groupDescription">
                <span class="status-dot" aria-hidden="true"></span>
                Loading group…
            </p>
        </div>

        <button id="refreshButton" type="button">
            ↻ Refresh
        </button>

    </header>

    <!-- MAIN LAYOUT -->

    <main class="layout">

        <!-- GROUP MEMBERS -->

        <aside class="panel members-panel">

            <div class="panel-head">

                <div class="panel-heading">
                    <strong>Group members</strong>
                    <small>People in this conversation</small>
                </div>

                <button id="addMembersButton" type="button">
                    ＋ Add
                </button>

            </div>

            <div id="membersList">
                <p class="system-message">Loading members…</p>
            </div>

        </aside>

        <!-- CHAT -->

        <section class="panel chat-panel">

            <div class="chat-info" id="chatStatus">
                Messages are visible to group members.
            </div>

            <div
                id="messagesArea"
                role="log"
                aria-live="polite"
                aria-label="Group chat messages"
                aria-relevant="additions text"
            >
                <div class="system-message">
                    Loading conversation…
                </div>
            </div>

            <!-- MESSAGE COMPOSER -->

            <div class="composer">

                <form id="messageForm">

                    <input
                        type="file"
                        id="groupFileInput"
                        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.jpg,.jpeg,.png,.webp,.gif,.mp4,.mp3,.m4a,.wav,.zip"
                        hidden
                    >

                    <button
                        class="action-btn file-btn"
                        id="groupFileButton"
                        type="button"
                    >
                        📎 File
                    </button>

                    <button
                        class="action-btn voice-btn"
                        id="voiceButton"
                        type="button"
                    >
                        🎙 Voice
                    </button>

                    <textarea
                        id="messageInput"
                        maxlength="10000"
                        placeholder="Write a message…"
                        aria-label="Message"
                    ></textarea>

                    <button
                        class="action-btn send-btn"
                        id="sendButton"
                        type="submit"
                    >
                        Send ➤
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- ADD MEMBERS MODAL -->

    <div
        class="modal-backdrop"
        id="membersModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="membersModalTitle"
    >

        <div class="modal">

            <h2 id="membersModalTitle">Add group members</h2>

            <p>
                Enter the exact email address of a registered Cozmic user.
                You can add one person at a time.
            </p>

            <form id="addMemberForm">

                <label for="memberEmail">
                    Member email
                </label>

                <input
                    id="memberEmail"
                    type="email"
                    required
                    autocomplete="email"
                    placeholder="person@example.com"
                >

                <div class="modal-actions">

                    <button
                        class="action-btn secondary-btn"
                        id="cancelMembersButton"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button
                        class="action-btn primary-btn"
                        type="submit"
                    >
                        Add member
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- FOOTER -->

    <footer class="page-footer">
        Powered by <strong>Cozmic</strong>
    </footer>

    <!-- KEEP YOUR EXISTING CHAT JAVASCRIPT -->

    <script src="group-chat.js"></script>

</body>
</html>
